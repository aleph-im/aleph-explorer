
name: Build app

on:
  pull_request:
    branches: ["*"]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so `git describe --tags` in vite.config.js
          # produces a real version string (e.g. v0.1.9b-51-g35a6cb6)
          # instead of falling back to "unknown build".
          fetch-depth: 0
          fetch-tags: true

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Build
        run: yarn build
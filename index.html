    <!-- Open Graph (Facebook, LinkedIn, Discord, etc.) -->
    <meta property="og:type" content="website" />

    <!-- Structured data: WebSite schema with SearchAction for sitelinks search box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Aleph Cloud Explorer",
      "url": "https://explorer.aleph.cloud/",
      "description": "Block explorer for Aleph Cloud. Browse signed messages, addresses and aggregates, and cryptographically verify that any message is signed, batched and anchored on Ethereum.",
      "publisher": {
        "@type": "Organization",
        "name": "Aleph Cloud",
        "url": "https://aleph.cloud"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://explorer.aleph.cloud/addresses?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link
